<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Jailbreak Archives logo">
  <title>Jailbreak Archives — animated logo</title>
  <defs>
    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.18;0.5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="lblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect x="2" y="2" width="156" height="156" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="156" height="156" rx="30" fill="none" stroke="#58a6ff" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(80,80)">
    <circle r="62" fill="url(#lglow)" filter="url(#lblur)"/>
    <circle r="56" fill="none" stroke="#1f2a3f" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#243148" stroke-width="1.2"/>
    <g>
      <circle r="48" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 9" opacity="0.65"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="62" fill="none" stroke="#8957e5" stroke-width="1.3" stroke-dasharray="2 12" opacity="0.55"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M0 0 L58 -24 A58 58 0 0 1 58 24 Z" fill="url(#lsweep)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>
    <circle r="16" fill="none" stroke="#00e5a0" stroke-width="1.5">
      <animate attributeName="r" values="8;56" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- orbiting satellites -->
    <g>
      <circle cx="0" cy="-62" r="4" fill="#00e5a0"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-48" r="3" fill="#f0b429"/>
      <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="13s" repeatCount="indefinite"/>
    </g>
    <!-- pulsing core lock -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" repeatCount="indefinite"/>
      <path d="M-8 -6 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#00e5a0" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="-12" y="-6" width="24" height="20" rx="5" fill="#0d1117" stroke="#00e5a0" stroke-width="3"/>
      <circle cx="0" cy="1" r="2.8" fill="#00e5a0"/>
      <rect x="-1.5" y="2.5" width="3" height="6" rx="1.5" fill="#00e5a0"/>
    </g>
  </g>
</svg>
