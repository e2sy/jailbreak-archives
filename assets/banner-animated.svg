<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-label="Jailbreak Archives — adversarial prompt engineering archive">
  <title>Jailbreak Archives — AI Safety Research &amp; Defensive Hardening</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#16233f" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#0d1526" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#00e5a0;#8957e5;#f0b429;#58a6ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8957e5">
        <animate attributeName="stop-color" values="#8957e5;#f0b429;#58a6ff;#00e5a0;#8957e5" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#00e5a0">
        <animate attributeName="stop-color" values="#00e5a0;#8957e5;#f0b429;#58a6ff;#00e5a0" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.2;0.55" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2740" stroke-width="1"/>
    </pattern>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- base layers -->
  <rect width="1500" height="360" fill="url(#bg)"/>
  <rect width="1500" height="360" fill="url(#grid)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1500" height="360" fill="url(#vignette)"/>
  <ellipse cx="750" cy="345" rx="620" ry="52" fill="#58a6ff" opacity="0.10" filter="url(#blur14)">
    <animate attributeName="opacity" values="0.10;0.2;0.10" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- corner HUD brackets -->
  <g stroke="#30363d" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M22 46 V22 H46"/><path d="M1454 22 H1478 V46"/>
    <path d="M22 314 V338 H46"/><path d="M1478 314 V338 H1454"/>
  </g>

  <!-- ===== left radar emblem ===== -->
  <g transform="translate(165,185)">
    <!-- outer glow -->
    <circle r="118" fill="url(#coreGlow)" filter="url(#blur8)"/>
    <!-- rings -->
    <circle r="105" fill="none" stroke="#1f2a3f" stroke-width="1.5"/>
    <circle r="78" fill="none" stroke="#243148" stroke-width="1.2">
      <animate attributeName="stroke" values="#243148;#2f4166;#243148" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="none" stroke="#243148" stroke-width="1.2"/>
    <!-- rotating dashed HUD ring -->
    <g>
      <circle r="92" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 11" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="118" fill="none" stroke="#8957e5" stroke-width="1.4" stroke-dasharray="2 14" opacity="0.5"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </g>
    <!-- radar sweep -->
    <g>
      <path d="M0 0 L105 -44 A105 105 0 0 1 105 44 Z" fill="url(#sweepGrad)"/>
      <line x1="0" y1="0" x2="105" y2="-44" stroke="#58a6ff" stroke-width="1.6" opacity="0.8" filter="url(#blur3)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <!-- sweep ping -->
    <circle r="30" fill="none" stroke="#00e5a0" stroke-width="1.5">
      <animate attributeName="r" values="10;105" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- pulsing core lock -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.09;1" dur="3.2s" repeatCount="indefinite"/>
      <path d="M-11 -9 v-7 a11 11 0 0 1 22 0 v7" fill="none" stroke="#00e5a0" stroke-width="4" stroke-linecap="round"/>
      <rect x="-16" y="-9" width="32" height="26" rx="6" fill="#0d1117" stroke="#00e5a0" stroke-width="3.5"/>
      <circle cx="0" cy="2" r="4" fill="#00e5a0">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-2" y="4" width="4" height="8" rx="2" fill="#00e5a0"/>
    </g>
  </g>

  <!-- vertical separator -->
  <line x1="302" y1="70" x2="302" y2="290" stroke="#21262d" stroke-width="2">
    <animate attributeName="stroke" values="#21262d;#2c3a57;#21262d" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- ===== title block ===== -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace">
    <circle cx="322" cy="112" r="5" fill="#00e5a0">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="338" y="119" font-size="19" letter-spacing="4" fill="#8b949e">ADVERSARIAL PROMPT ENGINEERING ARCHIVE</text>
    <text x="320" y="196" font-size="68" font-weight="700" letter-spacing="2" fill="url(#titleGrad)">JAILBREAK ARCHIVES</text>
    <text x="322" y="242" font-size="18" fill="#8b949e">Structured, versioned &amp; reproducible adversarial prompt research</text>
    <!-- terminal line with blinking cursor -->
    <text x="322" y="296" font-size="17" fill="#00e5a0">$ ./archive --status  &#8594;  14 entries &#183; 7 model families &#183; CI verified</text>
    <rect x="1028" y="282" width="11" height="19" fill="#00e5a0">
      <animate attributeName="opacity" values="1;0" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== right constellation: floating nodes + flowing links ===== -->
  <g stroke="#58a6ff" stroke-width="1.1" stroke-dasharray="3 7" opacity="0.55">
    <line x1="1100" y1="80" x2="1230" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="1230" y1="60" x2="1380" y2="100">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1100" y1="80" x2="1165" y2="165">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="1230" y1="60" x2="1300" y2="150">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.3s" repeatCount="indefinite"/>
    </line>
    <line x1="1165" y1="165" x2="1300" y2="150">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.9s" repeatCount="indefinite"/>
    </line>
    <line x1="1300" y1="150" x2="1420" y2="210">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.1s" repeatCount="indefinite"/>
    </line>
    <line x1="1165" y1="165" x2="1080" y2="260">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="4.4s" repeatCount="indefinite"/>
    </line>
    <line x1="1300" y1="150" x2="1260" y2="240">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.7s" repeatCount="indefinite"/>
    </line>
    <line x1="1080" y1="260" x2="1260" y2="240">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.4s" repeatCount="indefinite"/>
    </line>
    <line x1="1260" y1="240" x2="1400" y2="300">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="4.1s" repeatCount="indefinite"/>
    </line>
    <line x1="1420" y1="210" x2="1400" y2="300">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle cx="1100" cy="80" r="4" fill="#58a6ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="60" r="5" fill="#00e5a0"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="100" r="3.5" fill="#8957e5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1165" cy="165" r="5.5" fill="#f0b429"><animate attributeName="opacity" values="1;0.25;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="150" r="4" fill="#58a6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1420" cy="210" r="4.5" fill="#ff7b72"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="260" r="4" fill="#00e5a0"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1260" cy="240" r="5" fill="#8957e5"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="300" r="3.5" fill="#58a6ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1165" cy="165" r="10" fill="none" stroke="#f0b429" opacity="0.5">
      <animate attributeName="r" values="6;16" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== full-width scanning beam ===== -->
  <g>
    <rect x="0" width="1500" height="3" fill="url(#scanGrad)" filter="url(#blur3)">
      <animate attributeName="y" values="46;314;46" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
